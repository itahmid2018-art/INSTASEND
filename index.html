<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Pre-hydration dark theme initial detection to prevent flashing
      try {
        var theme = localStorage.getItem('instasend_theme') || 'system';
        var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (e) {}
    </script>
    <title>InstaSend — Secure Peer-to-Peer File Transfer via WebRTC</title>
    <meta name="description" content="InstaSend: Blazing-fast, end-to-end encrypted peer-to-peer file and data sharing directly between devices using WebRTC." />
    <meta property="og:title" content="InstaSend — Secure Peer-to-Peer File Transfer via WebRTC" />
    <meta property="og:description" content="InstaSend: Blazing-fast, end-to-end encrypted peer-to-peer file and data sharing directly between devices using WebRTC." />
    <meta name="theme-color" content="#1a73e8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="InstaSend" />

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
