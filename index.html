<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: https: blob:; worker-src 'self' blob:;" />
    <script>
      // Gracefully prevent transient Vite dev-server HMR WebSocket disconnects from bubbling up as unhandled errors
      window.addEventListener('error', function(event) {
        if (event && event.message && (event.message.includes('WebSocket') || event.message.includes('vite') || event.message.includes('@vite'))) {
          event.preventDefault?.();
          event.stopPropagation?.();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && String(event.reason).includes('WebSocket')) {
          event.preventDefault?.();
          event.stopPropagation?.();
        }
      }, true);
    </script>
    <title>InstaSend — Secure Peer-to-Peer File Transfer via WebRTC</title>
    <meta name="description" content="InstaSend: Blazing-fast, end-to-end encrypted peer-to-peer file and data sharing directly between devices using WebRTC." />
    <meta property="og:title" content="InstaSend — Secure Peer-to-Peer File Transfer via WebRTC" />
    <meta property="og:description" content="InstaSend: Blazing-fast, end-to-end encrypted peer-to-peer file and data sharing directly between devices using WebRTC." />

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
