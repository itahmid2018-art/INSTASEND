name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
      - develop

jobs:
  build-android:
    name: Compile Android App & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App & Bundle
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Locate Compiled APK
        id: locate_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK at: $APK_PATH"

      - name: Generate Release Tag & Changelog
        id: changelog
        run: |
          TAG_NAME="v1.0.$(date +%Y%m%d%H%M%S)"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          
          # Extract recent commit messages for release update notes
          COMMITS=$(git log -n 5 --pretty=format:"- %s (%an)")
          echo "COMMIT_LOG<<EOF" >> $GITHUB_ENV
          echo "$COMMITS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag_name }}
          name: "InstaSend Android Release ${{ steps.changelog.outputs.tag_name }}"
          body: |
            ## 🚀 Automated Android Build & Release
            
            This automated release was compiled and built directly from commit: `${{ github.sha }}`.
            
            ### 📝 Update Notes & Recent Code Changes:
            ${{ env.COMMIT_LOG }}
            
            ### 📱 Download Instructions:
            Download the `app-debug.apk` binary below and install it directly on your Android phone, tablet, or Android TV device.
          files: |
            ${{ steps.locate_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
