services:
  instasend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: instasend-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BIND_HOST=0.0.0.0
      - DATA_DIR=/app/data
      - SQLITE_PATH=/app/data/instasend.db
      - JWT_SECRET=${JWT_SECRET:-instasend_prod_secret_key_change_in_production}
    volumes:
      - instasend-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/db/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  instasend-data:
    driver: local
